# Local tracing dashboard for Domia's OTLP export (TraceService).
#
#   docker compose -f docker-compose.observability.yml up -d
#   export DOMIA_OTEL_ENDPOINT=http://localhost:4318/v1/traces
#   npm run cli -- run ...        # or `npm run server`, or the desktop app
#   open http://localhost:16686   # Jaeger UI — search service "domia"
#
# Domain events (run.started/completed/failed/degraded, plugin.loaded, …) are
# exported as OTLP spans; unset DOMIA_OTEL_ENDPOINT to disable.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # Jaeger UI
      - '4318:4318'   # OTLP/HTTP receiver
