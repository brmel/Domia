# Domia Electron Builder Configuration
# https://www.electron.build/configuration/configuration

appId: com.domia.app
productName: Domia
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# The main bundle is vite-built, so node_modules is excluded except the vite
# externals and their full transitive runtime closure (regenerate with the
# dep-walk in scripts/package-smoke.mjs if the externals list changes).
files:
  - dist
  - dist-electron
  - prompts/**/*
  - "!node_modules/**/*"
  - node_modules/ajv/**/*
  - node_modules/ajv-formats/**/*
  - node_modules/fast-deep-equal/**/*
  - node_modules/fast-uri/**/*
  - node_modules/json-schema-traverse/**/*
  - node_modules/junit-report-builder/**/*
  - node_modules/kysely/**/*
  - node_modules/kysely-generic-sqlite/**/*
  - node_modules/kysely-wasm/**/*
  - node_modules/lodash/**/*
  - node_modules/make-dir/**/*
  - node_modules/playwright/**/*
  - node_modules/playwright-core/**/*
  - node_modules/require-from-string/**/*
  - node_modules/semver/**/*
  - node_modules/sql.js/**/*
  - node_modules/xmlbuilder/**/*

# The first-run browser bootstrap spawns playwright's CLI as a plain node
# process, which cannot read from inside the asar archive.
asarUnpack:
  - node_modules/playwright/**/*
  - node_modules/playwright-core/**/*

# macOS configuration
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/icon.png

# Windows configuration
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.png

# Linux configuration
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: public/icon.png

# NSIS installer config for Windows
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# Auto-update configuration
publish:
  provider: github
  releaseType: draft
