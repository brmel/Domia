name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install chromium
      
      - name: Build and package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds until real certificates exist. To sign: remove this
          # flag and set CSC_LINK/CSC_KEY_PASSWORD (macOS) and WIN_CSC_LINK/
          # WIN_CSC_KEY_PASSWORD (Windows) as repository secrets — empty secrets
          # break electron-builder, so only add them when they have values.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
