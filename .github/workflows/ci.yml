name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Conventional commit check
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

      - name: Type check
        run: npm run typecheck

      - name: Architecture boundaries
        run: npm run check:architecture

      - name: Lint
        run: npm run lint

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      # Replay-LLM e2e (deterministic) — includes the CLI + IPC smokes.
      # Coverage thresholds in vitest.config.ts are the regression floor.
      - name: Tests
        run: npm run test:coverage

      # The live LLM-driven CLI scenarios (`npm run test:cli`) need a real
      # GOOGLE_API_KEY and are non-deterministic, so they are NOT part of the
      # per-PR gate. Run them on demand locally or in a separate keyed lane.
