name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Architecture boundaries
        run: npm run check:architecture

      - name: Lint
        run: npm run lint

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      # Replay-LLM e2e (deterministic) — includes the CLI + IPC smokes.
      - name: Tests
        run: npm run test

      # The live LLM-driven CLI scenarios (`npm run test:cli`) need a real
      # GOOGLE_API_KEY and are non-deterministic, so they are NOT part of the
      # per-PR gate. Run them on demand locally or in a separate keyed lane.
