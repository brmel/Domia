name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true


jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install the browser playwright-mcp drives
        run: npx playwright install --with-deps chromium

      # Electron ships chrome-sandbox unprivileged inside node_modules. Chromium
      # checks it before the app's JavaScript runs and aborts rather than drop
      # sandboxing, so the CDP test never gets a window. Root-owned and 4755 is
      # what the error message asks for, and it keeps the sandbox on.
      # The require() first is not decoration: electron fetches its binary
      # lazily, so dist/ does not exist until something asks for it.
      - name: Let Electron's sandbox helper run
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # xvfb gives the headed-flip tests (F7) a display, so they run instead of skipping.
      - name: typecheck + module gate + integration suite
        run: xvfb-run -a npm run check
