name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Architecture boundaries
        run: npm run check:architecture

      # Non-blocking: lint currently surfaces pre-existing errors/warnings that
      # are tracked separately. The canonical boundary/correctness gates are
      # typecheck + check:architecture above.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Tests
        run: npm run test

      - name: CLI e2e tests
        run: npm run test:cli
