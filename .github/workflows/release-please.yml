name: Release Please

# Conventional commits on main accumulate into a release PR (version bump +
# CHANGELOG). Merging that PR tags vX.Y.Z, which triggers release.yml to
# build and upload the installers.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
