appId: dev.domia.app
productName: Domia
copyright: Copyright © 2026 Brahim Redouane
electronVersion: 43.1.1
directories:
  output: release
  buildResources: build
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: ../../../prompts
    to: prompts
  - from: ../../../node_modules/@playwright/mcp
    to: node_modules/@playwright/mcp
  - from: ../../../node_modules/playwright
    to: node_modules/playwright
  - from: ../../../node_modules/playwright-core
    to: node_modules/playwright-core
mac:
  category: public.app-category.developer-tools
  target: [dir, dmg, zip]
  identity: null
win:
  target: [nsis]
linux:
  category: Development
  target: [AppImage]
